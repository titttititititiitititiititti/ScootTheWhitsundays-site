# Render Blueprint for the self-service booking server.
# In Render: New → Blueprint → pick this repo. Secrets marked `sync: false`
# are typed into Render's dashboard (never stored in this file).
services:
  - type: web
    name: airlie-scooter-hire
    runtime: node
    plan: starter            # needed for the disk below (free plans can't keep data)
    region: singapore        # closest Render region to Airlie Beach
    branch: self-service-booking   # switch to main once the domain has moved over
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data   # trip videos and licence photos live here
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: airlie-scooter-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://airliescooterhire.com
      - key: EMAIL_FROM
        value: Airlie Scooter Hire <bookings@airliescooterhire.com>
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_PIN
        sync: false

# Bookings, prices and long-term rentals are stored here. (The built-in database
# needed more memory than the Starter plan's 512MB.) Render backs this up daily.
databases:
  - name: airlie-scooter-db
    plan: basic-256mb
    region: singapore
    databaseName: scooters
    user: scooters
    ipAllowList: []          # only reachable from your Render services
