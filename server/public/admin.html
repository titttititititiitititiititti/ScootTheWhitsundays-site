<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin | Airlie Scooter Hire</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3d1832">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASH Admin">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/Static/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/Static/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f1; --hero: linear-gradient(135deg, #1a1028 0%, #3d1832 20%, #8b2a3a 45%, #c44a2f 65%, #e8853a 82%, #f5c45a 100%);
    --red: #c0392b; --red-l: #d94f3f; --warm: #e07a3a; --gold: #e8a830; --deep: #8b2a3a;
    --text: #2c1810; --text2: #6b4e42; --muted: #8f7566; --border: #e8ddd4;
    --ok: #2f7a4b; --ok-bg: #e3f3e8; --warn: #b3701c; --warn-bg: #fdf0de; --bad: #8b2a2a; --bad-bg: #fdecea;
    --shadow: 0 4px 16px rgba(44,24,16,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  button, input, select { font: inherit; }
  [hidden] { display: none !important; }

  /* ── PIN screen ── */
  .pin-screen { min-height: 100vh; background: var(--hero); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom)); }
  .pin-screen h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; }
  .pin-screen p { color: #fff; opacity: 0.9; margin-top: 0.3rem; min-height: 1.4em; }
  .dots { display: flex; gap: 1rem; margin: 1.75rem 0 2rem; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); transition: background 0.12s; }
  .dot.on { background: #fff; }
  .dots.shake { animation: shake 0.35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 1rem 1.4rem; }
  .key { width: 76px; height: 76px; border-radius: 50%; border: none; background: rgba(255,255,255,0.16); color: #fff; font-size: 1.9rem; font-weight: 500; cursor: pointer; backdrop-filter: blur(4px); }
  .key:active { background: rgba(255,255,255,0.35); }
  .key.blank { visibility: hidden; }
  .key.small { font-size: 1rem; background: none; }

  /* ── App ── */
  header.top { background: var(--hero); color: #fff; padding: calc(0.9rem + env(safe-area-inset-top)) 1rem 1.6rem; }
  .top-inner { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .top h1 { font-family: 'Fraunces', serif; font-size: 1.35rem; }
  .top small { display: block; opacity: 0.85; font-size: 0.85rem; }
  .linkbtn { background: rgba(255,255,255,0.18); color: #fff; border: none; border-radius: 99px; padding: 0.45rem 0.9rem; font-size: 0.85rem; cursor: pointer; }
  main { max-width: 720px; margin: -0.8rem auto 0; padding: 0 0.85rem calc(6rem + env(safe-area-inset-bottom)); display: grid; gap: 0.85rem; }
  .card { background: #fff; border-radius: 1rem; box-shadow: var(--shadow); padding: 1rem; }
  h2 { font-family: 'Fraunces', serif; font-size: 1.15rem; margin-bottom: 0.6rem; }
  h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0.2rem 0 0.5rem; }
  .muted { color: var(--muted); } .small { font-size: 0.88rem; }
  p { color: var(--text2); line-height: 1.5; }
  .empty { color: var(--muted); font-size: 0.92rem; padding: 0.25rem 0; }
  .pill { display: inline-block; font-size: 0.75rem; font-weight: 600; border-radius: 99px; padding: 0.15rem 0.55rem; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.grey { background: #f0e8e1; color: var(--text2); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.55rem 1rem; border-radius: 0.65rem; border: none; font-weight: 600; cursor: pointer; background: var(--red); color: #fff; text-decoration: none; font-size: 0.95rem; }
  .btn:disabled { background: #d8c9bf; }
  .btn.ghost { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
  .btn.quiet { background: var(--bg); color: var(--text2); }
  .btn.full { width: 100%; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .err { color: var(--bad); font-size: 0.88rem; margin-top: 0.4rem; }
  .okmsg { color: var(--ok); font-size: 0.88rem; margin-top: 0.4rem; }
  label.f { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text2); margin: 0.6rem 0 0.25rem; }
  input.i, select.i { width: 100%; min-height: 46px; border: 1.5px solid var(--border); border-radius: 0.6rem; padding: 0.55rem 0.7rem; font-size: 1rem; background: #fff; color: var(--text); }
  input.i:focus, select.i:focus { outline: none; border-color: var(--warm); box-shadow: 0 0 0 3px rgba(224,122,58,0.15); }
  .money-in { position: relative; } .money-in span { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .money-in input { padding-left: 1.6rem; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0.6rem; }
  .check { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; font-size: 0.92rem; color: var(--text2); }
  .check input { width: 20px; height: 20px; accent-color: var(--red); }

  /* bookings */
  .bk { border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.75rem 0.85rem; margin-top: 0.55rem; }
  .bk-top { display: flex; justify-content: space-between; gap: 0.6rem; align-items: flex-start; cursor: pointer; }
  .bk-name { font-weight: 600; }
  .bk-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.1rem; }
  .bk-pills { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: flex-end; }
  .bk-detail { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--border); font-size: 0.9rem; }
  .kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 0.2rem 0.8rem; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { overflow-wrap: anywhere; }
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
  .media a { display: block; border-radius: 0.5rem; overflow: hidden; background: #2c1810; aspect-ratio: 1; position: relative; color: #fff; text-decoration: none; font-size: 0.75rem; }
  .media img { width: 100%; height: 100%; object-fit: cover; }
  .media .vid { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 0.2rem; }
  .media .vid b { font-size: 1.6rem; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }

  /* scooters */
  .sc { border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.8rem; margin-top: 0.55rem; }
  .sc-head { display: flex; gap: 0.75rem; align-items: center; }
  .sc-head img, .sc-head .ph { width: 54px; height: 54px; border-radius: 0.6rem; object-fit: cover; background: var(--bg); flex: none; }
  .sc-head .ph { display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  .sc-name { font-weight: 600; } .sc-name small { display: block; font-weight: 400; color: var(--muted); font-size: 0.85rem; }
  .blk { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; background: var(--warn-bg); border-radius: 0.55rem; padding: 0.45rem 0.6rem; margin-top: 0.45rem; font-size: 0.88rem; }
  .blk button { background: none; border: none; color: var(--bad); font-weight: 600; cursor: pointer; padding: 0.3rem 0.4rem; }
  .sub { margin-top: 0.6rem; padding: 0.7rem; background: var(--bg); border-radius: 0.65rem; }

  .lt { background: #f3ecfb; border: 1px solid #e0d2f2; border-radius: 0.65rem; padding: 0.65rem 0.75rem; margin-top: 0.6rem; font-size: 0.9rem; }
  .lt b.t { color: #5b3a86; }
  .due { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; padding: 0.5rem 0; border-top: 1px solid var(--border); }
  .due:first-of-type { border-top: none; }
  .due .btn { min-height: 38px; padding: 0.4rem 0.8rem; font-size: 0.88rem; }
  .pill.lt-pill { background: #f3ecfb; color: #5b3a86; }

  /* money */
  .big { font-family: 'Fraunces', serif; font-size: 1.9rem; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
  .seg .btn { min-height: 38px; padding: 0.4rem; font-size: 0.88rem; }
  .stat { background: var(--bg); border-radius: 0.75rem; padding: 0.75rem; }
  .stat small { color: var(--muted); font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 0.35rem 0.25rem; }
  td { padding: 0.55rem 0.25rem; border-top: 1px solid var(--border); }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .barline { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--red), var(--warm), var(--gold)); margin-top: 0.3rem; }

  /* bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs button { background: none; border: none; padding: 0.55rem 0 0.6rem; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; color: var(--muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; }
  nav.tabs button b { font-size: 1.3rem; line-height: 1.2; font-weight: 400; }
  nav.tabs button.on { color: var(--red); }
  .toast { position: fixed; left: 50%; bottom: calc(5rem + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: #fff; padding: 0.6rem 1rem; border-radius: 99px; font-size: 0.9rem; z-index: 20; max-width: 90vw; }
</style>
</head>
<body>

<section class="pin-screen" id="pinScreen" hidden>
  <h1>Airlie Scooter Hire</h1>
  <p id="pinMsg">Enter your PIN</p>
  <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="pad" id="pad"></div>
</section>

<div id="app" hidden>
  <header class="top"><div class="top-inner">
    <div><h1 id="tabTitle">Bookings</h1><small id="todayLbl"></small></div>
    <button class="linkbtn" id="logout">Log out</button>
  </div></header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="bookings" class="on"><b>📅</b>Bookings</button>
    <button data-tab="scooters"><b>🛵</b>Scooters</button>
    <button data-tab="prices"><b>🏷️</b>Prices</button>
    <button data-tab="money"><b>💰</b>Money</button>
    <button data-tab="visitors"><b>👀</b>Visitors</button>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (c) => '$' + (Number(c) / 100).toLocaleString('en-AU', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
  const dlr = (c) => (Number(c) / 100).toString();
  const fmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
  const plural = (n, w) => `${n} ${w}${Number(n) === 1 ? '' : 's'}`;
  const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  let data = null, tab = 'bookings';
  const open = new Set(); // expanded bookings

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }

  async function api(path, opts = {}) {
    const res = await fetch('/api/admin' + path, {
      method: opts.method || 'GET',
      headers: opts.body ? { 'Content-Type': 'application/json' } : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin',
    });
    const j = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/login') { showPin(); throw new Error('Please log in again.'); }
    if (!res.ok) throw Object.assign(new Error(j.error || 'Something went wrong.'), { status: res.status });
    return j;
  }

  // ── PIN pad ──
  let pin = '';
  function showPin(msg) {
    $('app').hidden = true; $('pinScreen').hidden = false; pin = ''; drawDots();
    $('pinMsg').textContent = msg || 'Enter your PIN';
  }
  function drawDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
  $('pad').innerHTML = keys.map((k) => `<button class="key ${k === '' ? 'blank' : ''} ${k === '⌫' ? 'small' : ''}" data-k="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k}</button>`).join('');
  $('pad').addEventListener('click', (e) => { const k = e.target.closest('.key')?.dataset.k; if (k) press(k); });
  document.addEventListener('keydown', (e) => {
    if ($('pinScreen').hidden) return;
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫');
  });
  let busy = false;
  async function press(k) {
    if (busy) return;
    if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    drawDots();
    if (pin.length < 4) return;
    busy = true;
    try {
      await api('/login', { method: 'POST', body: { pin } });
      $('pinScreen').hidden = true; await load();
    } catch (e) {
      $('dots').classList.add('shake'); setTimeout(() => $('dots').classList.remove('shake'), 400);
      $('pinMsg').textContent = e.message;
      pin = ''; setTimeout(drawDots, 250);
    } finally { busy = false; }
  }

  $('logout').addEventListener('click', async () => { await api('/logout', { method: 'POST' }).catch(() => {}); showPin('Logged out'); });

  // ── Tabs ──
  const titles = { bookings: 'Bookings', scooters: 'Scooters', prices: 'Prices', money: 'Money', visitors: 'Visitors' };
  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.tab; try { localStorage.setItem('adminTab', tab); } catch {}
    render(); window.scrollTo(0, 0);
  });

  async function load() {
    data = await api('/overview');
    $('app').hidden = false;
    $('todayLbl').textContent = 'Today: ' + fmt(data.today);
    render();
  }

  function render() {
    $('tabTitle').textContent = titles[tab];
    [...$('tabs').children].forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    ({ bookings: renderBookings, scooters: renderScooters, prices: renderPrices, money: renderMoney, visitors: renderVisitors })[tab]();
  }

  // ── Bookings ──
  const statusPill = (b) => ({
    confirmed: '<span class="pill grey">Booked</span>', active: '<span class="pill ok">Out now</span>',
    returned: '<span class="pill ok">Returned</span>', bond_released: '<span class="pill ok">Done</span>',
    awaiting_bond: '<span class="pill bad">Bond not secured</span>',
  }[b.status] || `<span class="pill grey">${esc(b.status)}</span>`);
  const bondPill = (b) => (b.bondStatus === 'held' ? `<span class="pill warn">${money(b.bond)} held</span>` : b.bondStatus === 'charged' ? `<span class="pill warn">${money(b.bond)} bond paid</span>` : '');

  function bookingCard(b) {
    const bikes = (b.bikes.length === 1 ? 'Bike ' : 'Bikes ') + b.bikes.join(', ');
    const vids = `${b.pickupMedia ? '✓' : '–'} pickup · ${b.returnMedia ? '✓' : '–'} return`;
    return `<div class="bk" data-id="${b.id}">
      <div class="bk-top">
        <div><div class="bk-name">${esc(b.name)}</div>
          <div class="bk-sub">${esc(bikes)} · ${fmt(b.start)} → ${fmt(b.end)}</div>
          <div class="bk-sub">${money(b.rent + (b.deliveryAmount || 0))} · videos: ${vids}</div>
          ${b.delivery || b.collection ? `<div class="bk-sub">📍 ${esc(b.address || '')}</div>` : ''}</div>
        <div class="bk-pills">${statusPill(b)}${bondPill(b)}${b.delivery ? '<span class="pill lt-pill">🚚 Deliver</span>' : ''}${b.collection ? '<span class="pill lt-pill">🚚 Collect</span>' : ''}</div>
      </div>
      <div class="bk-detail" ${open.has(b.id) ? '' : 'hidden'}><div class="muted small">Loading…</div></div>
    </div>`;
  }

  function renderBookings() {
    const t = data.today;
    const list = data.bookings;
    const pickups = list.filter((b) => b.start === t);
    const returns = list.filter((b) => b.end === t);
    const out = list.filter((b) => b.start < t && b.end > t);
    const upcoming = list.filter((b) => b.start > t);
    const past = list.filter((b) => b.end < t).reverse();
    const due = data.rentDue || [];
    const rentCard = due.length ? `<section class="card" style="border:2px solid var(--warn)"><h2>Rent due (${due.length})</h2>
      ${due.map((d) => `<div class="due"><div><b>Bike ${d.bike}</b> · ${esc(d.renter)}<br><span class="small ${d.dueDate < t ? '' : 'muted'}" style="${d.dueDate < t ? 'color:var(--bad);font-weight:600' : ''}">${d.dueDate < t ? 'Overdue since' : 'Due'} ${fmt(d.dueDate)} · ${money(d.amount)}</span>
        ${d.phone ? `<br><a class="small" href="tel:${esc(d.phone.replace(/\s/g, ''))}" style="color:var(--red)">${esc(d.phone)}</a>` : ''}</div>
        <button class="btn" data-paid="${d.rentalId}" data-due="${d.dueDate}">Mark paid</button></div>`).join('')}</section>` : '';
    const sec = (title, items, emptyMsg) => `<section class="card"><h2>${title}</h2>${items.length ? items.map(bookingCard).join('') : `<div class="empty">${emptyMsg}</div>`}</section>`;
    $('view').innerHTML = rentCard +
      sec(`Pickups today (${pickups.length})`, pickups, 'No pickups today.') +
      sec(`Returns today (${returns.length})`, returns, 'No returns today.') +
      sec(`Out now (${out.length})`, out, 'Nothing else out.') +
      sec(`Coming up (${upcoming.length})`, upcoming, 'No upcoming bookings yet.') +
      (past.length ? sec('Last two weeks', past, '') : '');
    $('view').querySelectorAll('.bk').forEach((el) => {
      el.querySelector('.bk-top').addEventListener('click', () => toggleBooking(el));
      if (open.has(el.dataset.id)) fillBooking(el);
    });
    $('view').querySelectorAll('[data-paid]').forEach((b) => b.addEventListener('click', () => payRent(b)));
  }

  async function payRent(btn, undo = false) {
    btn.disabled = true;
    try {
      await api(`/long-term/${btn.dataset.paid}/paid`, { method: 'POST', body: { dueDate: btn.dataset.due, undo } });
      toast(undo ? 'Marked unpaid' : `Paid: week of ${fmt(btn.dataset.due)}`); await load();
    } catch (e) { toast(e.message); btn.disabled = false; }
  }

  async function toggleBooking(el) {
    const id = el.dataset.id, d = el.querySelector('.bk-detail');
    if (open.has(id)) { open.delete(id); d.hidden = true; return; }
    open.add(id); d.hidden = false; fillBooking(el);
  }

  async function fillBooking(el) {
    const d = el.querySelector('.bk-detail');
    let b;
    try { b = await api('/bookings/' + el.dataset.id); } catch (e) { d.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const yn = (v) => (v === true ? 'Yes' : v === false ? 'No' : '—');
    const mediaGrid = (phase, label) => {
      const items = b.media.filter((m) => m.phase === phase);
      if (!items.length) return `<h3 style="margin-top:0.8rem">${label}</h3><div class="empty">None yet</div>`;
      return `<h3 style="margin-top:0.8rem">${label}</h3><div class="media">${items.map((m) => {
        const src = '/api/admin/media/' + m.id;
        const tag = m.bike ? `Bike ${m.bike}` : '';
        return m.mime.startsWith('image/') && m.mime !== 'image/heic'
          ? `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${esc(label)}" loading="lazy"></a>`
          : `<a href="${src}" target="_blank" rel="noopener"><span class="vid"><b>${m.mime.startsWith('video/') ? '▶' : '🖼'}</b>${esc(tag)}<span>${Math.max(1, Math.round(m.size / 1e6))} MB</span></span></a>`;
      }).join('')}</div>`;
    };
    d.innerHTML = `<div class="kv">
        <span>Phone</span><span><a href="tel:${esc(b.phone.replace(/\s/g, ''))}" style="color:var(--red)">${esc(b.phone)}</a></span>
        <span>Email</span><span><a href="mailto:${esc(b.email)}" style="color:var(--red)">${esc(b.email)}</a></span>
        <span>Born</span><span>${esc(b.dob || '—')}</span>
        <span>Address</span><span>${esc(b.address || '—')}</span>
        <span>Licence</span><span>${esc([b.licence.type, b.licence.number, b.licence.country, b.licence.expiry && 'exp ' + b.licence.expiry].filter(Boolean).join(' · '))}</span>
        <span>12m+ licence</span><span>${yn(b.licence.over12Months)}</span>
        <span>Accidents</span><span>${yn(b.accidents)}${b.accidentDetails ? ' — ' + esc(b.accidentDetails) : ''}</span>
        <span>Restrictions</span><span>${yn(b.restrictions)}${b.restrictionDetails ? ' — ' + esc(b.restrictionDetails) : ''}</span>
        <span>Signed</span><span>${esc(b.signature)}</span>
      </div>
      ${mediaGrid('licence', 'Licence photos')}${mediaGrid('pickup', 'Pickup videos')}${mediaGrid('return', 'Return videos')}
      <div class="actions"><a class="btn ghost" href="tel:${esc(b.phone.replace(/\s/g, ''))}">Call</a><a class="btn ghost" href="sms:${esc(b.phone.replace(/\s/g, ''))}">Text</a></div>
      <p class="small muted" style="margin-top:0.6rem">Releasing or keeping the bond comes in the next update.</p>`;
  }

  // ── Scooters ──
  function todayState(s) {
    if (s.today.state === 'longterm') return `<span class="pill lt-pill">Long-term: ${esc(s.today.name)}</span>`;
    if (s.today.state === 'blocked') return `<span class="pill warn">${esc(s.today.reason)}${s.today.until ? ' until ' + fmt(s.today.until) : ''}</span>`;
    if (s.today.state === 'booked') return `<span class="pill grey">Booked until ${fmt(s.today.until)}</span>`;
    return '<span class="pill ok">Available today</span>';
  }

  function longTermBox(lt) {
    const started = lt.start > data.today ? `starts ${fmt(lt.start)}` : `since ${fmt(lt.start)}`;
    const weekday = new Date(lt.start + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long' });
    return `<div class="lt">
      <div class="row"><div><b class="t">Long-term · ${esc(lt.renter)}</b><br>${money(lt.weeklyRate)}/week · ${started} · rent day ${weekday}
        ${lt.phone ? `<br><a href="tel:${esc(lt.phone.replace(/\s/g, ''))}" style="color:var(--red)">${esc(lt.phone)}</a>` : ''}</div>
        <button class="btn quiet" data-act="ltEdit" style="min-height:36px;padding:0.3rem 0.7rem;font-size:0.85rem">Edit</button></div>
      <div style="margin-top:0.45rem">
      ${lt.owed.map((d) => `<div class="due"><span style="color:var(--bad);font-weight:600">${d < data.today ? 'Overdue' : 'Due today'}: ${fmt(d)} · ${money(lt.weeklyRate)}</span>
        <button class="btn" data-paid="${lt.id}" data-due="${d}">Mark paid</button></div>`).join('')}
      ${!lt.owed.length ? `<div class="due"><span style="color:var(--ok);font-weight:600">✓ Paid up${lt.nextDue ? ` · next due ${fmt(lt.nextDue)}` : ''}</span>
        ${lt.nextDue ? `<button class="btn quiet" data-paid="${lt.id}" data-due="${lt.nextDue}" title="Record an early payment">Paid early</button>` : ''}</div>` : ''}
      </div>
      <div class="small muted" style="margin-top:0.3rem">${plural(lt.paidWeeks, 'week')} paid · ${money(lt.totalPaid)} received</div>
    </div>`;
  }

  function renderScooters() {
    const free = data.bikes.filter((s) => s.today.state === 'free').length;
    const ltCount = data.bikes.filter((s) => s.today.state === 'longterm').length;
    $('view').innerHTML = `
      <section class="card"><div class="row"><div><h2 style="margin:0">${free} of ${plural(data.bikes.length, 'scooter')} free today</h2>
        <p class="small muted">${ltCount ? `${ltCount} on long-term rental (${money(data.longTermWeekly)}/week). ` : ''}Scooters on long-term rental, in repair or unavailable don't show in online booking.</p></div></div></section>
      ${data.bikes.map((s) => `
      <section class="card sc" data-id="${s.id}" style="margin-top:0">
        <div class="sc-head">
          ${s.photo ? `<img src="/${s.photo.split('/').map(encodeURIComponent).join('/')}" alt="">` : '<div class="ph">🛵</div>'}
          <div style="flex:1;min-width:0"><div class="sc-name">Bike ${s.number}<small>${esc(s.name)}${s.needsMotorcycleLicence ? ' · motorcycle licence' : ''}</small></div>
            <div style="margin-top:0.25rem">${todayState(s)}</div></div>
        </div>
        ${s.blocks.map((b) => `<div class="blk"><span><b>${esc(b.reason)}</b><br>${fmt(b.start)} → ${b.end ? fmt(b.end) : 'until you change it'}</span>
          <button data-unblock="${b.id}">Make available</button></div>`).join('')}
        ${s.longTerm ? longTermBox(s.longTerm) : ''}
        <div class="actions">
          ${s.longTerm ? '' : '<button class="btn" data-act="lt">Rent long-term</button>'}
          <button class="btn ${s.longTerm ? '' : 'quiet'}" data-act="block">${s.longTerm ? 'Repair / unavailable' : 'Unavailable'}</button>
          <button class="btn quiet" data-act="edit">Edit</button>
        </div>
        <div class="sub" data-form="lt" hidden>
          <label class="f">Renter's name</label><input class="i" name="renter" maxlength="80" autocomplete="off">
          <label class="f">Renter's phone (optional)</label><input class="i" name="phone" inputmode="tel" maxlength="40" autocomplete="off">
          <div class="grid2">
            <div><label class="f">Weekly price</label><div class="money-in"><span>$</span><input class="i" name="weekly" inputmode="decimal" placeholder="150"></div></div>
            <div><label class="f">Started on</label><input class="i" type="date" name="start" value="${data.today}"></div>
          </div>
          <p class="small muted" style="margin-top:0.5rem">Rent is due on the start day and every 7 days after. You'll get an email on rent day if it isn't marked paid.</p>
          <div class="actions"><button class="btn" data-act="saveLt">Save</button><button class="btn quiet" data-act="cancel">Cancel</button></div>
          <div class="err" hidden></div>
        </div>
        ${s.longTerm ? `<div class="sub" data-form="ltEdit" hidden>
          <label class="f">Weekly price</label><div class="money-in"><span>$</span><input class="i" name="weekly" inputmode="decimal" value="${dlr(s.longTerm.weeklyRate)}"></div>
          <label class="f">Renter's phone</label><input class="i" name="phone" inputmode="tel" value="${esc(s.longTerm.phone || '')}">
          <div class="actions"><button class="btn" data-act="saveLtEdit">Save</button><button class="btn quiet" data-act="cancel">Cancel</button>
            <button class="btn ghost" data-act="endLt" style="margin-left:auto">Scooter returned</button></div>
          <div class="err" hidden></div>
        </div>` : ''}
        <div class="sub" data-form="block" hidden>
          <label class="f">Reason</label>
          <select class="i" name="reason"><option>Repair</option><option>Unavailable</option></select>
          <div class="grid2">
            <div><label class="f">From</label><input class="i" type="date" name="start" value="${data.today}"></div>
            <div><label class="f">Until</label><input class="i" type="date" name="end"></div>
          </div>
          <label class="check"><input type="checkbox" name="open" checked> Until I change it (no end date)</label>
          <div class="actions"><button class="btn" data-act="saveBlock">Save</button><button class="btn quiet" data-act="cancel">Cancel</button></div>
          <div class="err" hidden></div>
        </div>
        <div class="sub" data-form="edit" hidden>
          <label class="f">Name</label><input class="i" name="name" value="${esc(s.name)}" maxlength="80">
          <label class="check"><input type="checkbox" name="moto" ${s.needsMotorcycleLicence ? 'checked' : ''}> Needs a motorcycle licence (over 50cc)</label>
          <div class="actions"><button class="btn" data-act="saveEdit">Save</button><button class="btn quiet" data-act="cancel">Cancel</button>
            <button class="btn ghost" data-act="retire" style="margin-left:auto">Remove scooter</button></div>
          <div class="err" hidden></div>
        </div>
      </section>`).join('')}
      <section class="card">
        <h2>Add a scooter</h2>
        <label class="f">Name</label><input class="i" id="newName" placeholder="e.g. Kymco Agility 50cc" maxlength="80">
        <label class="check"><input type="checkbox" id="newMoto"> Needs a motorcycle licence (over 50cc)</label>
        <div class="actions"><button class="btn" id="addBike">Add scooter</button></div>
        <div class="err" id="addErr" hidden></div>
      </section>`;

    $('view').querySelectorAll('.sc').forEach((card) => {
      const id = card.dataset.id;
      const form = (n) => card.querySelector(`[data-form="${n}"]`);
      const showErr = (f, m) => { const e = f.querySelector('.err'); e.textContent = m; e.hidden = !m; };
      const endInput = form('block').querySelector('[name=end]'), openBox = form('block').querySelector('[name=open]');
      endInput.disabled = openBox.checked;
      openBox.addEventListener('change', () => { endInput.disabled = openBox.checked; if (!openBox.checked && !endInput.value) endInput.value = addDays(data.today, 30); });
      endInput.addEventListener('input', () => { if (endInput.value) openBox.checked = false; });
      card.addEventListener('click', async (e) => {
        const un = e.target.closest('[data-unblock]');
        if (un) {
          un.disabled = true;
          try { await api('/blocks/' + un.dataset.unblock, { method: 'DELETE' }); toast('Available again'); await load(); } catch (er) { toast(er.message); un.disabled = false; }
          return;
        }
        if (e.target.closest('[data-paid]')) return;
        const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
        const forms = ['block', 'edit', 'lt', 'ltEdit'];
        const toggle = { block: 'block', edit: 'edit', lt: 'lt', ltEdit: 'ltEdit' }[act];
        if (toggle) forms.forEach((n) => { const f = form(n); if (f) f.hidden = n !== toggle || !f.hidden; });
        if (act === 'cancel') forms.forEach((n) => { const f = form(n); if (f) f.hidden = true; });
        if (act === 'saveLt') {
          const f = form('lt');
          const body = { renterName: f.querySelector('[name=renter]').value, renterPhone: f.querySelector('[name=phone]').value, weeklyRate: f.querySelector('[name=weekly]').value, start: f.querySelector('[name=start]').value };
          try {
            const r = await api(`/bikes/${id}/long-term`, { method: 'POST', body });
            if (r.conflicts.length) alert('Heads up: this scooter has paid online bookings from that date:\n\n' + r.conflicts.map((c) => `${c.name} (${c.phone}): ${fmt(c.start)} → ${fmt(c.end)}`).join('\n') + '\n\nThose bookings are still on. Swap their scooter or contact them.');
            toast('Long-term rental saved'); await load();
          } catch (er) { showErr(f, er.message); }
        }
        if (act === 'saveLtEdit') {
          const f = form('ltEdit'), s2 = data.bikes.find((x) => String(x.id) === id);
          try { await api('/long-term/' + s2.longTerm.id, { method: 'PATCH', body: { weeklyRate: f.querySelector('[name=weekly]').value, renterPhone: f.querySelector('[name=phone]').value } }); toast('Saved'); await load(); } catch (er) { showErr(f, er.message); }
        }
        if (act === 'endLt') {
          const s2 = data.bikes.find((x) => String(x.id) === id);
          if (!confirm(`Mark Bike ${s2.number} as returned today? It becomes bookable online again from tomorrow. Unpaid weeks stay in "Rent due".`)) return;
          try { await api(`/long-term/${s2.longTerm.id}/end`, { method: 'POST', body: {} }); toast('Rental ended'); await load(); } catch (er) { showErr(form('ltEdit'), er.message); }
        }
        if (act === 'saveBlock') {
          const f = form('block');
          const body = { reason: f.querySelector('[name=reason]').value, start: f.querySelector('[name=start]').value, end: openBox.checked ? null : endInput.value };
          if (!openBox.checked && !body.end) return showErr(f, 'Choose an end date, or tick "until I change it".');
          try {
            const r = await api(`/bikes/${id}/blocks`, { method: 'POST', body });
            if (r.conflicts.length) alert('Heads up: this scooter already has paid bookings in that time:\n\n' + r.conflicts.map((c) => `${c.name} (${c.phone}): ${fmt(c.start)} → ${fmt(c.end)}`).join('\n') + '\n\nThose bookings are still on. Contact them or swap their scooter.');
            toast('Saved'); await load();
          } catch (er) { showErr(f, er.message); }
        }
        if (act === 'saveEdit') {
          const f = form('edit');
          try { await api('/bikes/' + id, { method: 'PATCH', body: { name: f.querySelector('[name=name]').value, needsMotorcycleLicence: f.querySelector('[name=moto]').checked } }); toast('Saved'); await load(); } catch (er) { showErr(f, er.message); }
        }
        if (act === 'retire') {
          if (!confirm('Remove this scooter from the fleet? It will no longer be bookable. Its past bookings and income stay on record.')) return;
          try { await api('/bikes/' + id, { method: 'PATCH', body: { retired: true } }); toast('Removed'); await load(); } catch (er) { showErr(form('edit'), er.message); }
        }
      });
    });
    $('view').querySelectorAll('[data-paid]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); payRent(b); }));
    $('addBike').addEventListener('click', async () => {
      try { const r = await api('/bikes', { method: 'POST', body: { name: $('newName').value, needsMotorcycleLicence: $('newMoto').checked } }); toast(`Added as Bike ${r.bike.number}`); await load(); }
      catch (e) { $('addErr').textContent = e.message; $('addErr').hidden = false; }
    });
  }

  // ── Prices ──
  function renderPrices() {
    const p = data.pricing;
    $('view').innerHTML = `
      <section class="card">
        <h2>Prices per scooter</h2>
        <p class="small">Changes apply to <b>new bookings only</b>. Bookings already paid keep their price.</p>
        <label class="f" for="pDaily">Daily rate</label>
        <div class="money-in"><span>$</span><input class="i" id="pDaily" inputmode="decimal" value="${dlr(p.dailyRate)}"></div>
        <label class="f" for="pOne">Extra for a one-day hire</label>
        <div class="money-in"><span>$</span><input class="i" id="pOne" inputmode="decimal" value="${dlr(p.oneDayExtra)}"></div>
        <label class="f" for="pWeek">Weekly price (optional, leave 0 for off)</label>
        <div class="money-in"><span>$</span><input class="i" id="pWeek" inputmode="decimal" value="${dlr(p.weeklyRate)}"></div>
        <label class="f" for="pDel">Delivery or pick-up, per scooter per trip</label>
        <div class="money-in"><span>$</span><input class="i" id="pDel" inputmode="decimal" value="${dlr(p.deliveryFee)}"></div>
        <p class="small muted" style="margin-top:0.3rem">Optional for customers: delivery at the start, pick-up at the end, or both.</p>
        <div class="sub" id="example" style="margin-top:0.9rem"></div>
        <div class="actions"><button class="btn full" id="savePrices">Save prices</button></div>
        <div class="err" id="pErr" hidden></div>
      </section>
      <section class="card"><h2>Bond</h2><p class="small">$250 per scooter. Change it in the server settings file if you ever need to.</p></section>`;
    const val = (id) => Math.round(Number($(id).value || 0) * 100);
    const example = () => {
      const d = val('pDaily'), one = val('pOne'), wk = val('pWeek');
      const rent = (n) => (n === 1 ? d + one : wk > 0 && n >= 7 ? Math.floor(n / 7) * wk + Math.min((n % 7) * d, wk) : n * d);
      $('example').innerHTML = `<h3>A customer would pay</h3><div class="kv">${[1, 2, 3, 5, 7, 14].map((n) => `<span>${plural(n, 'day')}</span><span><b>${money(rent(n))}</b></span>`).join('')}</div>`;
    };
    ['pDaily', 'pOne', 'pWeek'].forEach((id) => $(id).addEventListener('input', example));
    example();
    $('savePrices').addEventListener('click', async () => {
      $('pErr').hidden = true;
      try {
        const r = await api('/pricing', { method: 'PUT', body: { dailyRate: $('pDaily').value, oneDayExtra: $('pOne').value, weeklyRate: $('pWeek').value, deliveryFee: $('pDel').value } });
        data.pricing = r.pricing; toast('Prices saved — new bookings use them now');
      } catch (e) { $('pErr').textContent = e.message; $('pErr').hidden = false; }
    });
  }

  // ── Money ──
  function renderMoney() {
    const n = (v) => Number(v || 0);
    const rows = data.bikes.map((b) => ({ ...b,
      month: n(b.income.thisMonth) + n(b.income.longTermThisMonth),
      all: n(b.income.allTime) + n(b.income.longTermAllTime) })).sort((a, b) => b.all - a.all);
    const month = rows.reduce((s, b) => s + b.month, 0) + n(data.delivery.thisMonth);
    const total = rows.reduce((s, b) => s + b.all, 0) + n(data.delivery.allTime);
    const top = Math.max(1, ...rows.map((b) => b.all));
    const ltBikes = data.bikes.filter((b) => b.today.state === 'longterm').length;
    const monthName = new Date(data.today + 'T00:00:00').toLocaleDateString('en-AU', { month: 'long' });
    $('view').innerHTML = `
      <section class="card"><div class="grid2">
        <div class="stat"><small>${esc(monthName)}</small><div class="big">${money(month)}</div></div>
        <div class="stat"><small>All time</small><div class="big">${money(total)}</div></div>
      </div>
      <div class="stat" style="margin-top:0.6rem"><small>Long-term rent right now</small><div class="big">${money(data.longTermWeekly)}<span class="small muted" style="font-family:Outfit"> /week</span></div>
        <small>${plural(ltBikes, 'scooter')} on long-term rental</small></div>
      <p class="small muted" style="margin-top:0.6rem">Online hire rent + long-term rent marked paid + delivery fees (${money(data.delivery.allTime)} all time). Bonds aren't counted.</p></section>
      <section class="card"><h2>Per scooter</h2>
        <table><thead><tr><th>Scooter</th><th class="n">${esc(monthName.slice(0, 3))}</th><th class="n">All time</th></tr></thead><tbody>
        ${rows.map((b) => `<tr><td><b>Bike ${b.number}</b><br><span class="small muted">${esc(b.name)}</span>
          <div class="small muted">${[
            n(b.income.hires) && `${plural(b.income.hires, 'online hire')} ${money(b.income.allTime)}`,
            n(b.income.longTermAllTime) && `long-term ${money(b.income.longTermAllTime)} (${plural(b.income.longTermWeeks, 'week')})`,
          ].filter(Boolean).join(' · ') || 'Nothing yet'}</div>
          <div class="barline" style="width:${Math.round((b.all / top) * 100)}%"></div></td>
          <td class="n">${money(b.month)}</td><td class="n"><b>${money(b.all)}</b></td></tr>`).join('')}
        </tbody></table></section>`;
  }

  // ── Visitors ──
  let visitorDays = 1, visitorData = null, visitorSeq = 0;
  async function renderVisitors() {
    const seq = ++visitorSeq;
    if (!visitorData || visitorData.days !== visitorDays) $('view').innerHTML = '<section class="card"><p class="muted">Loading…</p></section>';
    try {
      const d = await api('/visitors?days=' + visitorDays);
      if (seq !== visitorSeq || tab !== 'visitors') return;
      visitorData = d;
      drawVisitors();
    } catch (e) {
      if (seq === visitorSeq && tab === 'visitors') $('view').innerHTML = `<section class="card"><p class="err">${esc(e.message)}</p></section>`;
    }
  }
  function drawVisitors() {
    const d = visitorData, f = d.funnel;
    const steps = [
      ['Visited the website', f.visit],
      ['Opened the booking page', f.bookOpen],
      ['Saw a price', f.priceSeen],
      ['Went to payment', f.checkout],
      ['Booked and paid', f.paid],
    ];
    const top = Math.max(1, ...steps.map((x) => x[1]));
    const lost = Math.max(0, f.priceSeen - f.checkout);
    const outcome = {
      booked: '<span class="pill ok">Booked</span>',
      payment: '<span class="pill warn">Went to payment, didn’t pay</span>',
      left: '<span class="pill bad">Saw price, left</span>',
    };
    const when = (iso) => new Date(iso).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    const opt = (o) => `${fmt(o.start)} → ${fmt(o.end)} · ${plural(o.days, 'day')} · ${plural(o.scooters, 'scooter')} · <b>${money(o.amount)}</b>`;
    $('view').innerHTML = `
      <section class="card">
        <div class="seg" id="visRange">${[[1, 'Today'], [7, '7 days'], [30, '30 days']].map(([n, l]) =>
          `<button class="btn ${n === visitorDays ? '' : 'quiet'}" data-days="${n}">${l}</button>`).join('')}</div>
        <table style="margin-top:0.6rem"><tbody>
        ${steps.map(([k, v]) => `<tr><td>${k}<div class="barline" style="width:${Math.round((v / top) * 100)}%"></div></td><td class="n"><b>${v}</b></td></tr>`).join('')}
        </tbody></table>
        ${f.priceSeen ? `<p class="small" style="margin-top:0.6rem">${lost ? `<b>${plural(lost, 'person')}</b> saw a price and didn’t go on to payment.` : 'Everyone who saw a price went on to payment.'}</p>` : ''}
        <p class="small muted" style="margin-top:0.4rem">People, not page views. Bots and your own visits while logged in here aren’t counted. No names or contact details are recorded.</p>
      </section>
      ${d.lengths.length ? `<section class="card"><h2>By hire length</h2>
        <p class="small muted">If short hires rarely go to payment but longer ones do, the single-day price may be too high.</p>
        <table><thead><tr><th>Looking at</th><th class="n">Saw price</th><th class="n">Went to payment</th></tr></thead><tbody>
        ${d.lengths.map((x) => `<tr><td>${esc(x.length)}</td><td class="n">${x.saw_price}</td><td class="n">${x.went_to_payment} <span class="muted small">(${Math.round((x.went_to_payment / x.saw_price) * 100)}%)</span></td></tr>`).join('')}
        </tbody></table></section>` : ''}
      ${d.sources.length ? `<section class="card"><h2>Where they came from</h2>
        <table><tbody>${d.sources.map((x) => `<tr><td>${esc(x.source)}</td><td class="n"><b>${x.visitors}</b></td></tr>`).join('')}</tbody></table></section>` : ''}
      <section class="card"><h2>Recent price checks</h2>
        ${d.recent.length ? d.recent.map((r) => `<div style="padding:0.6rem 0;border-top:1px solid var(--border)">
          <div class="row"><span class="small muted">${esc(when(r.at))} · from ${esc(r.source)}</span>${outcome[r.outcome] || ''}</div>
          ${r.options.map((o) => `<div class="small" style="margin-top:0.2rem">${opt(o)}</div>`).join('')}
        </div>`).join('') : '<p class="muted small">Nobody has checked a price yet in this period.</p>'}
      </section>`;
    $('visRange').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-days]'); if (!b) return;
      visitorDays = Number(b.dataset.days); renderVisitors();
    });
  }

  try { const saved = localStorage.getItem('adminTab'); if (titles[saved]) tab = saved; } catch {}
  api('/status').then((s) => {
    if (!s.enabled) { showPin('Admin is off: set ADMIN_PIN on the server'); $('pad').hidden = true; return; }
    if (s.loggedIn) load(); else showPin();
  }).catch(() => showPin('Can’t reach the server'));
})();
</script>
</body>
</html>
