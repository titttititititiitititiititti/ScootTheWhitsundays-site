<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Trip | Airlie Scooter Hire</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/Static/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #faf6f1; --bg-hero: linear-gradient(135deg, #1a1028 0%, #3d1832 20%, #8b2a3a 45%, #c44a2f 65%, #e8853a 82%, #f5c45a 100%);
    --accent-red: #c0392b; --accent-red-light: #d94f3f; --accent-warm: #e07a3a; --accent-gold: #e8a830; --accent-deep: #8b2a3a;
    --text-primary: #2c1810; --text-secondary: #6b4e42; --text-muted: #8f7566; --border: #e8ddd4;
    --ok: #2f7a4b; --ok-bg: #e3f3e8;
    --shadow-md: 0 4px 16px rgba(44,24,16,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
  .hero { background: var(--bg-hero); color: #fff; padding: 1.25rem 1rem 3.5rem; position: relative; }
  .hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent-red), var(--accent-warm), var(--accent-gold)); }
  .hero-inner { max-width: 560px; margin: 0 auto; }
  .hero a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; }
  .hero h1 { font-family: 'Fraunces', serif; font-size: 1.75rem; margin-top: 0.9rem; }
  .hero p { opacity: 0.9; margin-top: 0.25rem; }
  main { max-width: 560px; margin: -1.75rem auto 0; padding: 0 1rem 3rem; position: relative; display: grid; gap: 1rem; }
  .card { background: #fff; border-radius: 1rem; box-shadow: var(--shadow-md); padding: 1.25rem; }
  h2 { font-family: 'Fraunces', serif; font-size: 1.25rem; display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-red); color: #fff; font: 600 0.9rem 'Outfit', sans-serif; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .num.done { background: var(--ok); }
  p, li { color: var(--text-secondary); line-height: 1.55; }
  .small { font-size: 0.88rem; }
  .muted { color: var(--text-muted); }
  .facts { display: grid; gap: 0.35rem; font-size: 0.95rem; }
  .facts div { display: flex; justify-content: space-between; gap: 1rem; }
  .facts span:first-child { color: var(--text-muted); }
  .facts span:last-child { text-align: right; }
  details { margin: 0.5rem 0 0.9rem; }
  summary { cursor: pointer; color: var(--accent-deep); font-weight: 600; font-size: 0.92rem; }
  details ul { padding-left: 1.2rem; margin-top: 0.4rem; font-size: 0.9rem; }
  .bike { border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.85rem; margin-top: 0.7rem; }
  .bike-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .bike-name { font-weight: 600; }
  .bike-name small { display: block; font-weight: 400; color: var(--text-muted); font-size: 0.82rem; }
  .status { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.15rem; }
  .status.ok { color: var(--ok); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 46px; padding: 0.65rem 1.1rem; border-radius: 0.7rem; border: none; font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer; background: var(--accent-red); color: #fff; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--accent-red-light); }
  .btn:disabled { background: #d8c9bf; cursor: default; }
  .btn.ghost { background: #fff; color: var(--accent-red); border: 1.5px solid var(--accent-red); }
  .btn.big { width: 100%; min-height: 54px; font-size: 1.05rem; }
  .bar { height: 8px; background: #f0e4da; border-radius: 99px; overflow: hidden; margin-top: 0.6rem; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-red), var(--accent-warm), var(--accent-gold)); transition: width 0.2s; }
  .err { color: #8b2a2a; font-size: 0.88rem; margin-top: 0.5rem; }
  .confirm { background: #fff8ec; border: 1px solid #f3d9a8; border-radius: 0.7rem; padding: 0.75rem 0.85rem; margin-top: 0.7rem; }
  .confirm p { font-size: 0.92rem; margin-bottom: 0.65rem; }
  .confirm-btns { display: flex; gap: 0.5rem; }
  .confirm-btns .btn { flex: 1; white-space: normal; text-align: center; }
  .area { margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
  .area ul { list-style: none; margin-top: 0.35rem; display: grid; gap: 0.3rem; }
  .area li { font-size: 0.9rem; color: #8b2a2a; font-weight: 500; }
  .locked { background: var(--bg-primary); border-radius: 0.7rem; padding: 0.7rem 0.85rem; font-size: 0.9rem; color: var(--text-muted); margin-top: 0.6rem; }
  .center { text-align: center; }
  .spinner { width: 40px; height: 40px; border: 4px solid #f0e4da; border-top-color: var(--accent-red); border-radius: 50%; margin: 1rem auto; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
  <a href="/">&larr; Airlie Scooter Hire</a>
  <h1 id="title">Your trip</h1>
  <p id="subtitle"></p>
</div></header>
<main id="main"><section class="card"><div class="spinner"></div></section></main>

<script>
(() => {
  const t = new URLSearchParams(location.search).get('t');
  const main = document.getElementById('main');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
  const mb = (n) => (n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(n / 1e6)) + ' MB');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  let trip = null;
  let uploading = 0;

  window.addEventListener('beforeunload', (e) => { if (uploading) { e.preventDefault(); e.returnValue = ''; } });

  function fail(title, msg) {
    main.innerHTML = `<section class="card center"><h2 style="justify-content:center">${esc(title)}</h2><p>${msg}</p></section>`;
  }

  async function load() {
    if (!t) return fail('Trip not found', 'This link is missing its booking code. Please use the link in your confirmation email.');
    let r, d;
    try { r = await fetch('/api/trip?t=' + encodeURIComponent(t)); d = await r.json(); } catch { return fail('Can’t connect', 'Please check your connection and reload the page.'); }
    if (r.status === 404) return fail('Trip not found', 'Please check the link in your email, or call us.');
    if (!d.ready) { location.replace('/booked?t=' + encodeURIComponent(t)); return; }
    trip = d;
    render();
  }

  function count(phase, bike) {
    const items = trip.media.filter((m) => m.phase === phase && m.bike === bike);
    return { videos: items.filter((m) => m.kind === 'video').length, photos: items.filter((m) => m.kind === 'photo').length, total: items.length };
  }
  const allDone = (phase) => trip.bikes.every((b) => count(phase, b.number).total > 0);
  function statusText(c) {
    if (!c.total) return '<div class="status">Nothing uploaded yet</div>';
    const parts = [c.videos && plural(c.videos, 'video'), c.photos && plural(c.photos, 'photo')].filter(Boolean).join(' + ');
    return `<div class="status ok">✓ ${parts} uploaded</div>`;
  }

  function bikeRows(phase, open, lockedMsg) {
    if (!open) return `<div class="locked">${esc(lockedMsg)}</div>`;
    return trip.bikes.map((b) => `
      <div class="bike" data-phase="${phase}" data-bike="${b.number}">
        <div class="bike-top">
          <div class="bike-name">Bike ${b.number}<small>${esc(b.name)}</small>${statusText(count(phase, b.number))}</div>
          <button type="button" class="btn add ${count(phase, b.number).total ? 'ghost' : ''}">${count(phase, b.number).total ? 'Add more' : 'Add video'}</button>
        </div>
        <div class="confirm" hidden>
          <p><b>⏱ Keep the video under 1 minute.</b><br>One slow walk around the scooter is all we need. Longer videos may not upload.</p>
          <div class="confirm-btns">
            <button type="button" class="btn ghost cancel">Cancel</button>
            <label class="btn">Got it — open camera<input type="file" accept="video/*,image/*" multiple hidden></label>
          </div>
        </div>
        <div class="bar" hidden><i></i></div>
        <div class="status prog" hidden></div>
        <div class="err" hidden></div>
      </div>`).join('');
  }

  function render() {
    const d = trip;
    const many = d.bikes.length > 1;
    document.getElementById('title').textContent = `Hi ${d.name}, here's your trip`;
    document.getElementById('subtitle').textContent = `${many ? 'Bikes' : 'Bike'} ${d.bikes.map((b) => b.number).join(', ')} · ${fmt(d.start)} – ${fmt(d.end)}`;
    const tips = `<details><summary>How to film it</summary><ul>
      <li>Keep it <b>under 1 minute</b> — one slow walk around the whole scooter.</li>
      <li>Show both sides, the front, the back, the seat and the mirrors.</li>
      <li>Finish on the dashboard so we can see the kilometres and fuel.</li>
      <li>Point the camera at any scratch or dent you notice.</li>
      <li>Photos are fine too if a video won’t upload.</li></ul></details>`;
    const pickupDone = allDone('pickup'), returnDone = allDone('return');

    main.innerHTML = `
      <section class="card">
        <div class="facts">
          <div><span>${d.delivery ? 'Delivery' : 'Pickup'}</span><span><b>${fmt(d.start)}</b> from ${esc(d.pickupFromTime)}${d.delivery ? `<br>to ${esc(d.address)}` : ''}</span></div>
          <div><span>${d.collection ? 'Collection' : 'Return'}</span><span><b>${fmt(d.end)}</b> by ${esc(d.returnByTime)}${d.collection ? `<br>from ${esc(d.address)}` : ''}</span></div>
          ${!d.delivery || !d.collection ? `<div><span>Carport</span><span>${esc(d.pickupAddress)}</span></div>` : ''}
        </div>
        <div class="area">
          <p class="small"><b>Where you can ride:</b> ${esc(d.ridingArea.summary.replace(/:$/, ''))}.</p>
          <ul>${d.ridingArea.noGo.map((s) => `<li>⛔ ${esc(s)}</li>`).join('')}</ul>
        </div>
      </section>

      <section class="card">
        <h2><span class="num ${pickupDone ? 'done' : ''}">${pickupDone ? '✓' : '1'}</span>Before you ride</h2>
        <p class="small">Film a quick walk-around of ${many ? 'each scooter' : 'the scooter'} before you ride off. It protects you: anything already there is on record.</p>
        ${tips}
        ${bikeRows('pickup', d.windows.pickup, d.today < d.start ? `This opens the day before your pickup (${fmt(d.start)}).` : 'Pickup videos are closed for this trip.')}
      </section>

      <section class="card">
        <h2><span class="num ${returnDone ? 'done' : ''}">${returnDone ? '✓' : '2'}</span>When you return</h2>
        <p class="small">${d.collection ? `Before we collect ${many ? 'them' : 'it'}, film` : `Park ${many ? 'each scooter' : 'the scooter'} back in ${many ? 'its spot' : 'the same spot'} and film`} another walk-around. We check it against the pickup video and release your bond.</p>
        ${bikeRows('return', d.windows.return, d.today < d.start ? `This opens on your pickup day (${fmt(d.start)}).` : 'Return videos are closed for this trip.')}
      </section>

      <p class="small center muted">Questions or a problem with a scooter? Call or text <a href="tel:${esc(d.phone.replace(/\s/g, ''))}" style="color:var(--accent-red)">${esc(d.phone)}</a></p>`;

    main.querySelectorAll('.bike').forEach((row) => {
      const box = row.querySelector('.confirm');
      row.querySelector('.add').addEventListener('click', () => { box.hidden = !box.hidden; });
      row.querySelector('.cancel').addEventListener('click', () => { box.hidden = true; });
    });
    main.querySelectorAll('.bike input[type=file]').forEach((input) => {
      input.addEventListener('change', () => {
        const row = input.closest('.bike');
        row.querySelector('.confirm').hidden = true;
        const files = [...input.files];
        input.value = '';
        if (files.length) uploadAll(row, files);
      });
    });
  }

  // ── Uploads (one file at a time, with a progress bar) ──
  async function uploadAll(row, files) {
    const phase = row.dataset.phase, bike = row.dataset.bike;
    const bar = row.querySelector('.bar'), fill = bar.querySelector('i');
    const prog = row.querySelector('.prog'), err = row.querySelector('.err');
    const label = row.querySelector('.add');
    err.hidden = true; bar.hidden = false; prog.hidden = false;
    label.style.pointerEvents = 'none'; label.style.opacity = '0.5';
    uploading++;
    let failed = false;
    for (const [i, file] of files.entries()) {
      if (file.size > trip.maxFileBytes) {
        err.textContent = `${file.name || 'That file'} is too big (${mb(file.size)}). Please record a shorter video, about 1 minute.`;
        err.hidden = false; failed = true; continue;
      }
      const label2 = files.length > 1 ? `File ${i + 1} of ${files.length}` : 'Uploading';
      try {
        await sendFile(file, phase, bike, (p) => {
          fill.style.width = (p * 100).toFixed(0) + '%';
          prog.textContent = `${label2}… ${(p * 100).toFixed(0)}% of ${mb(file.size)} — keep this page open`;
        });
        trip.media.push({ phase, bike: Number(bike), kind: file.type.startsWith('image/') ? 'photo' : 'video', size: file.size });
      } catch (e) {
        err.textContent = e.message; err.hidden = false; failed = true;
      }
    }
    uploading--;
    if (!uploading) {
      // Refresh from the server (so counts are exact), keeping any error message visible.
      const keepErr = failed ? { phase, bike, msg: err.textContent } : null;
      await load();
      if (keepErr) {
        const r2 = main.querySelector(`.bike[data-phase="${keepErr.phase}"][data-bike="${keepErr.bike}"] .err`);
        if (r2) { r2.textContent = keepErr.msg; r2.hidden = false; }
      }
    } else {
      label.style.pointerEvents = ''; label.style.opacity = '';
      bar.hidden = true; prog.hidden = true;
    }
  }

  function sendFile(file, phase, bike, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/trip/media?t=${encodeURIComponent(t)}&phase=${phase}&bike=${bike}`);
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else reject(new Error(body.error || 'The upload failed. Please try again.'));
      };
      xhr.onerror = () => reject(new Error('The upload stopped — please check your signal and try again.'));
      xhr.send(file);
    });
  }

  load();
})();
</script>
</body>
</html>
