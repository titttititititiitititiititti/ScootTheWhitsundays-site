<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Booking | Airlie Scooter Hire</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/Static/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #faf6f1; --bg-hero: linear-gradient(135deg, #1a1028 0%, #3d1832 20%, #8b2a3a 45%, #c44a2f 65%, #e8853a 82%, #f5c45a 100%);
    --accent-red: #c0392b; --accent-red-light: #d94f3f; --accent-warm: #e07a3a; --accent-gold: #e8a830;
    --text-primary: #2c1810; --text-secondary: #6b4e42; --text-muted: #8f7566; --border: #e8ddd4;
    --shadow-md: 0 4px 16px rgba(44,24,16,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
  .hero { background: var(--bg-hero); color: #fff; padding: 1.25rem 1rem 2.75rem; position: relative; }
  .hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent-red), var(--accent-warm), var(--accent-gold)); }
  .hero-inner { max-width: 560px; margin: 0 auto; }
  .hero a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; }
  main { max-width: 560px; margin: -1.5rem auto 0; padding: 0 1rem 3rem; position: relative; }
  .card { background: #fff; border-radius: 1rem; box-shadow: var(--shadow-md); padding: 1.75rem 1.25rem; text-align: center; }
  .icon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; }
  .icon.ok { background: #e3f3e8; color: #2f7a4b; }
  .icon.wait { background: #fdf0de; color: #b3701c; }
  .icon.bad { background: #fdecea; color: #8b2a2a; }
  h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; margin-bottom: 0.5rem; }
  p { color: var(--text-secondary); line-height: 1.55; margin-bottom: 0.75rem; }
  .summary { text-align: left; background: var(--bg-primary); border-radius: 0.75rem; padding: 1rem; margin: 1.25rem 0; font-size: 0.95rem; }
  .summary div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.25rem 0; }
  .summary span:first-child { color: var(--text-muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0.8rem 1.5rem; border-radius: 0.7rem; border: none; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; background: var(--accent-red); color: #fff; text-decoration: none; }
  .btn:hover { background: var(--accent-red-light); }
  .btn:disabled { background: #d8c9bf; }
  .spinner { width: 40px; height: 40px; border: 4px solid #f0e4da; border-top-color: var(--accent-red); border-radius: 50%; margin: 0 auto 1rem; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #8b2a2a; font-size: 0.9rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><a href="/">&larr; Airlie Scooter Hire</a></div></header>
<main><section class="card" id="card"><div class="spinner"></div><p>Loading your booking…</p></section></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const t = params.get('t');
  const card = document.getElementById('card');
  const money = (c) => '$' + (c / 100).toFixed(c % 100 ? 2 : 0);
  const fmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render(icon, kind, title, body, extra = '') {
    card.innerHTML = `${icon ? `<div class="icon ${kind}">${icon}</div>` : '<div class="spinner"></div>'}<h1>${esc(title)}</h1>${body}${extra}`;
  }
  function summary(b) {
    const bikes = (b.bikeNumbers.length === 1 ? 'Bike ' : 'Bikes ') + b.bikeNumbers.join(', ');
    return `<div class="summary">
      <div><span>Scooters</span><span>${esc(bikes)}</span></div>
      <div><span>Pickup</span><span>${fmt(b.start)}</span></div>
      <div><span>Return</span><span>${fmt(b.end)}</span></div>
      <div><span>Rent paid</span><span>${money(b.rent)}</span></div>
      <div><span>Bond</span><span>${money(b.bond)} ${b.bondMethod === 'hold' ? '(held, not charged)' : '(refundable)'}</span></div>
    </div>`;
  }

  if (!t) return render('!', 'bad', 'Booking not found', '<p>This link is missing its booking code. Please use the link from your email.</p>');

  async function cancel() {
    render(null, '', 'Cancelling…', '');
    const r = await fetch('/api/bookings/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t }) }).then((x) => x.json()).catch(() => ({}));
    history.replaceState(null, '', '/booked?t=' + encodeURIComponent(t));
    if (r.cancelled) return render('×', 'bad', 'Payment cancelled', '<p>No money was taken, and the scooters have been released.</p>', '<a class="btn" href="/book">Start again</a>');
    poll(); // it may have been paid after all
  }

  let tries = 0;
  async function poll() {
    let b;
    try {
      const r = await fetch('/api/booking-status?t=' + encodeURIComponent(t));
      if (r.status === 404) return render('!', 'bad', 'Booking not found', '<p>Please check the link in your email, or call us on 0478 393 479.</p>');
      b = await r.json();
    } catch { b = null; }
    if (!b) return setTimeout(poll, 3000);

    if (b.status === 'pending_payment') {
      if (++tries > 30) return render('…', 'wait', 'Still confirming your payment', '<p>This is taking longer than usual. You will get an email as soon as it is confirmed. If you were charged and get no email within 15 minutes, please call us on 0478 393 479.</p>');
      render(null, '', 'Confirming your payment…', '<p>This usually takes a few seconds.</p>');
      return setTimeout(poll, 2000);
    }
    if (b.status === 'awaiting_bond') {
      render('!', 'wait', 'One more step: your bond', `<p>Your rent is paid, but your bank didn't accept the ${money(b.bond)} bond hold automatically. Please confirm it below. It is a hold only and is not charged.</p><p>We'll send your lockbox code once the bond is confirmed.</p>`,
        summary(b) + '<button class="btn" id="bondBtn">Confirm bond hold</button><p class="err" id="bondErr"></p>');
      document.getElementById('bondBtn').addEventListener('click', async (e) => {
        e.target.disabled = true; e.target.textContent = 'Opening…';
        const r = await fetch('/api/bond-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t }) }).then((x) => x.json()).catch(() => ({}));
        if (r.url) location.href = r.url;
        else { e.target.disabled = false; e.target.textContent = 'Confirm bond hold'; document.getElementById('bondErr').textContent = r.error || 'Something went wrong. Please try again.'; }
      });
      return;
    }
    if (b.status === 'cancelled') {
      return render('×', 'bad', 'Booking cancelled', '<p>This booking was cancelled and no payment was taken.</p>', '<a class="btn" href="/book">Make a new booking</a>');
    }
    // confirmed / active / returned / bond_released
    render('✓', 'ok', `You're booked, ${b.name}!`,
      `<p>We've emailed your lockbox code and pickup instructions to <strong>${esc(b.email)}</strong>. Check your junk folder if it hasn't arrived in a few minutes.</p>`,
      summary(b) + `<a class="btn" href="/trip?t=${encodeURIComponent(t)}">Open your trip page</a><p style="font-size:0.85rem;margin-top:0.75rem">Your trip page is where you add the pickup and return videos. The link is also in your email.</p>`);
  }

  if (params.get('cancelled') === '1') cancel(); else poll();
})();
</script>
</body>
</html>
